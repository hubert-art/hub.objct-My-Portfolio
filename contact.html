<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact | Hubert Lubula</title>
    <link rel="icon" href="./src/assets/hubProfil.png" />
    <link rel="stylesheet" href="./src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/7b9d88401c.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="site-bg"></div>
    <div data-site-shell></div>
    <main class="page-enter" data-page="contact">
      <section class="page-header">
        <div class="container">
          <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="index.html">Home</a><span>/</span><span>Contact</span>
          </nav>
          <span class="eyebrow" data-i18n="contact.eyebrow">Contact</span>
          <h1 data-i18n="contact.title">Have an idea worth building?</h1>
        </div>
      </section>
      <section class="section">
        <div class="container contact-grid">
          <div class="contact-copy">
            <p data-i18n="contact.body">
              I am open to internships, freelance projects, collaborations, and
              conversations about modern digital products.
            </p>
            <div class="contact-methods">
              <a href="mailto:lubulahubert@mail.com"
                ><i class="fa-solid fa-envelope"></i> lubulahubert@mail.com</a
              ><a href="tel:+254141504419"
                ><i class="fa-solid fa-phone"></i> +254 141504419</a
              ><span
                ><i class="fa-solid fa-location-dot"></i> Nairobi, Kenya</span
              ><span
                ><i class="fa-solid fa-clock"></i>
                <span data-i18n="contact.availability"
                  >Available for select opportunities</span
                ></span
              >
            </div>
            <div class="map-placeholder">
              <i class="fa-solid fa-map-location-dot"></i
              ><span>Nairobi, Kenya</span>
            </div>
          </div>
          <form class="contact-form" novalidate>
            <label
              ><span data-i18n="form.name">Name</span
              ><input
                type="text"
                name="name"
                autocomplete="name"
                required /></label
            ><label
              ><span data-i18n="form.email">Email</span
              ><input
                type="email"
                name="email"
                autocomplete="email"
                required /></label
            ><label
              ><span data-i18n="form.project">Project Type</span
              ><select name="project" required>
                <option value="" data-i18n="form.choose">Choose one</option>
                <option>Website Development</option>
                <option>Full Stack Application</option>
                <option>UI/UX Design</option>
                <option>Mobile App Development</option>
                <option>3D Modeling and Animation</option>
                <option>Consulting</option>
              </select></label
            ><label
              ><span data-i18n="form.message">Message</span
              ><textarea name="message" rows="5" required></textarea></label
            ><button class="btn btn-primary" type="submit">
              <i class="fa-solid fa-paper-plane"></i
              ><span data-i18n="form.send">Send Message</span>
            </button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="./src/script.js"></script>
  </body>
</html>
